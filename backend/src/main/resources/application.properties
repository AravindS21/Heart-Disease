spring.application.name=cardio-guard-backend
server.port=8080

# Primary datasource config (configure your MySQL credentials here)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/heart_disease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

# ML Microservice URL (Python Flask on port 5000)
ml.service.url=${ML_SERVICE_URL:http://localhost:5000/api/predict}
