spring.application.name=cardio-guard-backend
server.port=8080

# Primary datasource config (configure your MySQL credentials here)
# If MySQL is not running, JPA gracefully falls back or user can enable H2
spring.datasource.url=jdbc:mysql://localhost:3306/heart_disease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ML Microservice URL
ml.service.url=http://localhost:5000/api/predict
